format: guyditor-profile/v1
id: youtube-longform
version: 1.0.0
displayName: "YouTube Long-form"
kind: longform
video:
  aspect: "16:9"
  resolution: { width: 3840, height: 2160 }
  resolutionsAllowed:
    - { width: 3840, height: 2160 }
    - { width: 1920, height: 1080 }
  fps: { allowed: ["24/1", "25/1", "30/1", "60/1", "24000/1001", "30000/1001", "60000/1001"], default: "30/1" }
  container: mp4
  codec: h264
  codecProfile: high
  pixelFormat: yuv420p
  colorSpace: bt709
  rateControl: { mode: crf, crf: 18, maxBitrateKbps: 45000 }
duration: { minSeconds: 1, maxSeconds: null, recommendedMaxSeconds: null }
audio:
  codec: aac
  sampleRate: 48000
  channels: 2
  bitrateKbps: 256
  loudness: { integratedLufs: -14, toleranceLu: 1.0, truePeakDbtp: -1.0, lraMaxLu: 11 }
safeAreas:
  title: { top: 0.05, bottom: 0.05, left: 0.05, right: 0.05 }
  action: { top: 0.025, bottom: 0.025, left: 0.025, right: 0.025 }
  platformUi:
    - { name: player-controls, rect: { x: 0.00, y: 0.90, w: 1.00, h: 0.10 } }
captionDefaults:
  maxLines: 2
  maxCharsPerLine: 42
  placement: { anchor: center, verticalCenter: 0.86 }
  perWordHighlight: false
metadata:
  title: { maxChars: 100 }
  description: { maxChars: 5000 }
  tags: { maxCount: 60, totalMaxChars: 500 }
  hashtags: { maxCount: 15, countedIn: description }
cover: { resolution: { width: 1280, height: 720 }, formats: [jpg, png], maxBytes: 2097152 }
chapters: { minCount: 3, minChapterSeconds: 10, firstMustBeZero: true }
