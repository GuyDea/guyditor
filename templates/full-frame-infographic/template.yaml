schema: guyditor/template/v1
id: tpl_d2e3f4g5h6
name: Full-frame infographic
kind: diagram
version: 1.0.0
engine: overlay/v1
entry: render.ts
min_guyditor: 1.0.0
duration:
  mode: fixed
  default: { frames: 150, fps: "30/1" }
params:
  type: object
  additionalProperties: false
  required: [title, body, accent, logoSlot]
  properties:
    title: { type: string, minLength: 1, maxLength: 88, default: "A clearer way forward" }
    body: { type: string, minLength: 1, maxLength: 320, default: "One focused idea, framed for a full-screen beat between scenes." }
    accent: { type: string, pattern: "^#[0-9A-Fa-f]{6}$", default: "#77E7C4" }
    logoSlot: { type: string, enum: [none, brand], default: brand }
preview:
  file: preview.png
  params:
    title: A clearer way forward
    body: One focused idea, framed for a full-screen beat between scenes.
    accent: "#77E7C4"
    logoSlot: brand
fonts:
  - { family: Inconsolata Guyditor, file: fonts/Inconsolata.otf, weight: 600 }
safe_area_aware: true
